# Netlify build config.
#
# Secrets scanning false positive: SUPABASE_ANON_KEY / SUPABASE_URL (and
# their VITE_ aliases) are Supabase's PUBLIC anon key and project URL - 
# by design they are inlined into the client bundle (dist/assets/*.js) so
# the browser can talk to Supabase. Netlify's secrets scanner still flags
# any configured env var whose literal value appears in the build output,
# even intentionally-public ones, so we omit exactly these four from the
# scan. Nothing else is omitted  - verified via a real build with stand-in
# fake secrets that GEMINI_API_KEY, SUPABASE_SERVICE_ROLE_KEY,
# STRIPE_SECRET_KEY, PAYSTACK_SECRET_KEY and RESEND_API_KEY never appear
# in dist/. Those stay unlisted here on purpose: if one of them ever shows
# up in a scan again, that's a real leak to fix in code, not to omit.
[build.environment]
  # Node 22 ships a native global WebSocket; on Node 20 the server-side
  # supabase-js client cannot construct (realtime-js throws) and the server
  # silently degrades to fallback seed state instead of the real database.
  NODE_VERSION = "22"
  # Belt-and-suspenders alongside the AWS_LAMBDA_FUNCTION_NAME runtime check in
  # server.ts: makes sure NODE_ENV=production is also true for the deployed
  # function, not just at build time.
  NODE_ENV = "production"
  # A plain `npm install` under NODE_ENV=production skips devDependencies
  # entirely -- and vite + @vitejs/plugin-react are (correctly) classed as
  # devDependencies since they're build tools, not runtime code. Without
  # this flag the build fails: "failed to load config from vite.config.ts
  # ... Cannot find package '@vitejs/plugin-react'". --include=dev forces
  # npm to install them anyway; the deployed function still runs with
  # NODE_ENV=production above, so runtime behavior is unaffected.
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,VITE_SUPABASE_ANON_KEY,SUPABASE_URL,VITE_SUPABASE_URL"

[functions]
  # Belt-and-suspenders alongside the Function-constructed dynamic import in
  # server.ts (which already hides `vite` from static bundler analysis):
  # if any future code path reintroduces a literal `import('vite')`, tell
  # esbuild to leave it unresolved rather than fail the build trying to trace
  # vite's own optional deps.
  node_bundler = "esbuild"
  external_node_modules = ["vite"]

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Server bridge: the Express app in server.ts serves the API and the
# crawlable HTML for every route. Redirects are skipped automatically for
# paths that match real static files in dist/, so hashed assets and any
# prerendered pages are still served straight off the CDN. The three
# specific prefixes are listed first for clarity; the trailing "/*" is the
# REQUIRED catch-all  - without it, client-side-only routes with no static
# file on disk (e.g. /admin, /login, /faq, /lovevault, /ai-copilot) have no
# matching redirect at all and Netlify serves its own platform 404 instead
# of falling through to the app (this was the actual bug: /admin 404'd).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/article/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/category/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
